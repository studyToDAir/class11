spring.application.name=boot_web

# default server port : 8080
#server.port=5000

# JSP 파일 위치
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# jsp 자동 reload
server.servlet.jsp.init-parameters.development=true
# java 변경 시 boot reload
spring.devtools.livereload.enabled=true

# log4j로 sql 출력
spring.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
spring.datasource.url=jdbc:log4jdbc:mariadb://localhost:3306/human
spring.datasource.username=root
spring.datasource.password=human1234$

# mybatis
mybatis.mapper-locations=classpath:mybatis/mappers/**/**.xml
mybatis.configuration.jdbc-type-for-null=NULL
mybatis.type-aliases-package=com.example.demo.dto
