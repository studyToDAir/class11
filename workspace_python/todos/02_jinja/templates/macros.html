{% macro render_card2(title, text) %}
    <div class="card">
        <h2>[2]{{title}}</h2>
        <div>
            [2]{{text}}
        </div>
        <div>
            [2]{{like}}
        </div>
    </div>
{% endmacro %}

            {{like}}
